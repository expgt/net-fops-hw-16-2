---
- name: Install Clickhouse
  hosts: clickhouse
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
      when: not ansible_check_mode
  tasks:
    - name: Download ClickHouse noarch RPM packages
      ansible.builtin.get_url:
        url: "https://packages.clickhouse.com/rpm/stable/{{ item }}-{{ clickhouse_version }}.noarch.rpm"
        dest: "./{{ item }}-{{ clickhouse_version }}.rpm"
        mode: '0644'
      with_items:
        - "clickhouse-client"
        - "clickhouse-server"
      check_mode: false

    - name: Check if ClickHouse static RPM already exists
      ansible.builtin.stat:
        path: "./clickhouse-common-static-{{ clickhouse_version }}.rpm"
      register: clickhouse_static_file

    - name: Download ClickHouse static x86_64 RPM package via wget
      ansible.builtin.command: >
        wget -q -O "./clickhouse-common-static-{{ clickhouse_version }}.rpm"
        "https://packages.clickhouse.com/rpm/stable/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
      when: not clickhouse_static_file.stat.exists
      register: wget_download
      #changed_when: wget_download.rc == 0
      check_mode: false

    - name: Install clickhouse packages
      become: true
      ansible.builtin.dnf:
        name:
          - "./clickhouse-common-static-{{ clickhouse_version }}.rpm"
          - "./clickhouse-client-{{ clickhouse_version }}.rpm"
          - "./clickhouse-server-{{ clickhouse_version }}.rpm"
        disable_gpg_check: true
      notify: Start clickhouse service

    - name: Flush handlers to ensure service is started
      ansible.builtin.meta: flush_handlers

    - name: Wait for ClickHouse server to start listening on port 9000
      ansible.builtin.wait_for:
        port: 9000
        delay: 3
        timeout: 30
        state: started

    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc != 82
      changed_when: create_db.rc == 0

- name: Install and configure Vector
  hosts: clickhouse
  vars:
    vector_version: "0.43.0"
    vector_config_dir: "/etc/vector"
  handlers:
    - name: Restart vector service
      become: true
      ansible.builtin.systemd_service:
        name: vector
        state: restarted
      when: not ansible_check_mode
  tasks:
    - name: Ensure Vector configuration directory exists
      become: true
      ansible.builtin.file:
        path: "{{ vector_config_dir }}"
        state: directory
        mode: '0755'

    - name: Download Vector RPM package
      ansible.builtin.get_url:
        url: "https://install.datadoghq.com/vector/{{ vector_version }}/vector-{{ vector_version }}-1.x86_64.rpm"
        dest: "/tmp/vector-{{ vector_version }}.rpm"
        mode: '0644'
      check_mode: false

    - name: Install Vector RPM package via DNF
      become: true
      ansible.builtin.dnf:
        name: "/tmp/vector-{{ vector_version }}.rpm"
        state: present
        disable_gpg_check: true

    - name: Deploy Vector configuration from template
      become: true
      ansible.builtin.template:
        src: templates/vector.yaml.j2
        dest: "{{ vector_config_dir }}/vector.yaml"
        mode: '0644'
      notify: Restart vector service

    - name: Start and enable Vector service
      become: true
      ansible.builtin.systemd_service:
        name: vector
        enabled: true
        state: started
      when: not ansible_check_mode
